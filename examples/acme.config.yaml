# Example config: "acme" host — the fuller setup.
#
# Adopt by copying into the host repo and adjusting paths/ids. Contains NO
# secrets — every secret is referenced by env-var NAME only (Telegram bot token,
# OpenRouter API key, Notion integration token) and resolved at use time; S3
# uses a named AWS profile, not inline credentials.
#
# Behavior: slide extraction on, S3 sync on (uploads recordings to a bucket via
# a named profile), original-language summaries, topic-routed Telegram (per-topic
# chat ids with a default fallback), Notion subpage insertion under a parent page.
#
# Backend mix (the primary cost-saving configuration):
#   - describe_slides -> openrouter (one OpenRouter vision call per slide;
#                                     the only slides backend)
#   - summarize       -> agno       (an Agno agent on an OpenRouter model, after
#                                     which the engine publishes the Notion
#                                     subpage via the Notion REST API)
# Both paths egress content to OpenRouter — see the README privacy note before
# enabling for sensitive content.

recordings_dir: ./recordings

stages:
  # Nested shape: {enabled, backend}. The legacy bare-bool form
  # (`slides: true`) is NOT accepted and raises a ConfigError.
  slides:
    enabled: true
    backend: openrouter  # "openrouter" (the only slides backend)
  s3_sync: true

transcribe:
  # model_id is an OpenRouter speech-to-text model slug. Audio is diarized and
  # chunked into explicit time slices before upload; audio egresses to
  # OpenRouter on every run (see the README privacy note).
  model_id: microsoft/mai-transcribe-2
  diarize: true          # label speakers in the transcript
  segment_seconds: 480   # audio chunk length sent per request
  overlap_seconds: 5     # overlap between adjacent chunks (stitching)

summary:
  language: original
  sections:
    - overview
    - key_points
    - action_items
  backend: agno  # "agno" (OpenRouter model + Notion REST publish) — the only backend

agent:
  # Only `output_file` is used (the summary filename + derived .telegram.md).
  output_file: "{basename}.md"

# OpenRouter connection, shared by the transcription speech-to-text calls, the
# slides vision calls, and the agno summarize agent. ALWAYS required (every run
# transcribes over OpenRouter). Secrets by env-var NAME only.
openrouter:
  api_key_env: OPENROUTER_API_KEY
  # base_url defaults to https://openrouter.ai/api/v1 when omitted.
  slides_model: google/gemini-2.0-flash-001   # cheap vision model
  summary_model: google/gemini-2.5-pro        # tool-capable (agno)

notion:
  server: notion-acme
  # Placeholder — replace with the real parent page id.
  parent_page_id: "REPLACE_WITH_PARENT_PAGE_ID"
  insert: subpage
  # Required because summary.backend == "agno": the engine publishes the Notion
  # subpage via the Notion REST API with this key. Env-var NAME only — no secret.
  token_env: NOTION_API_KEY

telegram:
  bot_token_env: ACME_BOT_TOKEN
  # Default fallback chat. With routing set, it receives the REMAINDER bucket —
  # content the partition did not assign to any topic below (a meeting entirely
  # about one topic sends nothing here).
  default_chat_id: "REPLACE_WITH_DEFAULT_CHAT_ID"
  routing:
    topic-a: "REPLACE_WITH_TOPIC_A_CHAT_ID"
    topic-b: "REPLACE_WITH_TOPIC_B_CHAT_ID"
  # Optional — steers the routing partition call ONLY (which content belongs to
  # which topic). A topic without a description falls back to its bare label.
  topic_descriptions:
    topic-a: "what topic-a covers (e.g. backend/infra work, deploys, incidents)"
    topic-b: "what topic-b covers (e.g. roadmap, UX, product decisions)"

s3:
  bucket: "s3://acme-recordings/recordings/"
  profile: acme
