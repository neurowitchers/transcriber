# Example config: "example" host — the simpler setup.
#
# Adopt by copying into the host repo and adjusting paths/ids. Contains NO
# secrets — the Telegram bot token is referenced by env-var NAME only and
# resolved at use time.
#
# Behavior: slide extraction on, no S3 sync, English summaries, single Telegram
# chat, Notion subpage insertion under a parent page. Slide description runs on
# the `openrouter` vision backend (the only slides backend); the summarize
# stage runs on the local `agy` backend.
#
# NOTE: enabling slides requires the `openrouter` block below and its API-key
# env var. Operators who must avoid any OpenRouter egress should keep
# `stages.slides.enabled: false`.

recordings_dir: ./recordings

stages:
  # Nested shape: {enabled, backend}. The legacy bare-bool form
  # (`slides: true`) is NOT accepted and raises a ConfigError.
  slides:
    enabled: true
    backend: openrouter  # "openrouter" (the only slides backend)
  s3_sync: false

transcribe:
  model_id: scribe_v1

summary:
  language: en
  sections:
    - overview
    - key_points
    - action_items
  backend: agy  # "agy" (local) | "agno" (OpenRouter model + Notion REST publish)

agent:
  cli: agy
  extra_args:
    - --dangerously-skip-permissions
  output_file: "{basename}.md"

# OpenRouter connection — required because slides are enabled (the slides
# descriptor is an OpenRouter vision call). Secrets by env-var NAME only.
openrouter:
  api_key_env: OPENROUTER_API_KEY
  # base_url defaults to https://openrouter.ai/api/v1 when omitted.
  slides_model: google/gemini-2.0-flash-001   # cheap vision model

notion:
  server: notion-example
  # Placeholder — replace with the real parent page id.
  parent_page_id: "REPLACE_WITH_PARENT_PAGE_ID"
  insert: subpage
  # notion.token_env is only required when summary.backend == "agno"; omitted
  # here because summarize runs on `agy` (which uses its own MCP).

telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN
  default_chat_id: "REPLACE_WITH_DEFAULT_CHAT_ID"
  routing: {}
