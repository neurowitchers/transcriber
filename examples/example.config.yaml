# Example config: "example" host — the simpler setup.
#
# Adopt by copying into the host repo and adjusting paths/ids. Contains NO
# secrets — the Telegram bot token is referenced by env-var NAME only and
# resolved at use time.
#
# Behavior: slide extraction on, no S3 sync, English summaries, single Telegram
# chat, Notion subpage insertion under a parent page. Slide description runs on
# the `openrouter` vision backend (the only slides backend); the summarize
# stage runs on the `agno` backend (an Agno agent on an OpenRouter model, after
# which the engine publishes the Notion subpage via the Notion REST API).
#
# NOTE: the `openrouter` block below is ALWAYS required — transcription itself
# now runs over the OpenRouter speech-to-text API, so audio egresses to
# OpenRouter on every run (see the README privacy note). There is no
# OpenRouter-free configuration.

recordings_dir: ./recordings

stages:
  # Nested shape: {enabled, backend}. The legacy bare-bool form
  # (`slides: true`) is NOT accepted and raises a ConfigError.
  slides:
    enabled: true
    backend: openrouter  # "openrouter" (the only slides backend)
  s3_sync: false

transcribe:
  # model_id is now an OpenRouter speech-to-text model slug. Audio is diarized
  # and chunked into explicit time slices before upload; see the README privacy
  # note (audio egresses to OpenRouter on every run).
  model_id: microsoft/mai-transcribe-2
  diarize: true          # label speakers in the transcript
  segment_seconds: 480   # audio chunk length sent per request
  overlap_seconds: 5     # overlap between adjacent chunks (stitching)

summary:
  language: en
  sections:
    - overview
    - key_points
    - action_items
  backend: agno  # "agno" (OpenRouter model + Notion REST publish) — the only backend

agent:
  # Only `output_file` is used (the summary filename + derived .telegram.md).
  output_file: "{basename}.md"

# OpenRouter connection — ALWAYS required: transcription runs over the
# OpenRouter speech-to-text API, and (here) slides are an OpenRouter vision
# call too. Secrets by env-var NAME only.
openrouter:
  api_key_env: OPENROUTER_API_KEY
  # base_url defaults to https://openrouter.ai/api/v1 when omitted.
  slides_model: google/gemini-2.0-flash-001   # cheap vision model
  summary_model: google/gemini-2.5-pro        # tool-capable (agno summarize)

notion:
  server: notion-example
  # Placeholder — replace with the real parent page id.
  parent_page_id: "REPLACE_WITH_PARENT_PAGE_ID"
  insert: subpage
  # Required because summary.backend == "agno": the engine publishes the Notion
  # subpage via the Notion REST API with this key. Env-var NAME only — no secret.
  token_env: NOTION_API_KEY

telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN
  default_chat_id: "REPLACE_WITH_DEFAULT_CHAT_ID"
  routing: {}
