[project]
name = "transcriber"
version = "0.1.0"
description = "Local-first AI enabled transcriber"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duct",
    "scenedetect",
    "av",
    "PyYAML",
    "httpx",
]

[project.scripts]
transcriber = "transcriber.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
# Summarize `agno` backend: only needed when summary.backend == "agno".
# Pinned (compatible-release) to the confirmed 3.0.x API. Includes the MCP
# tooling (agno.tools.mcp.MCPTools) and OpenRouter model provider used by the
# Agno summarize path.
agno = [
    "agno[mcp]~=3.0",
    "openai~=1.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]
