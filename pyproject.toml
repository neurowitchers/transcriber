[project]
name = "transcriber"
version = "0.1.0"
description = "Local-first AI enabled transcriber"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duct",
    "scenedetect",
    "av",
    "PyYAML",
    "httpx",
    # The `summarize` stage always runs on the `agno` backend, so these are
    # core (promoted from the former optional `agno` extra). Pinned
    # (compatible-release) to the confirmed 3.0.x API; includes the MCP tooling
    # (agno.tools.mcp.MCPTools) and the OpenRouter model provider.
    "agno[mcp]~=3.0",
    "openai~=1.0",
]

[project.scripts]
transcriber = "transcriber.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
# Deprecated no-op: `agno` is now a core dependency (above). This empty extra
# is retained so existing host dependency strings `transcriber[agno]` keep
# resolving during the migration window; drop it once all hosts drop `[agno]`.
agno = []

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]
